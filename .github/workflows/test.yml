name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run isolated tests
        shell: pwsh
        run: Invoke-Pester -Path tests -CI -Output Detailed

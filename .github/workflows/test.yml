name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run isolated tests
        shell: pwsh
        run: Invoke-Pester -Path tests -CI -Output Detailed
